</style><div id="root" data-composition-id="result" data-start="0" data-duration="4" data-width="1920" data-height="1080"><div class="fill" style="background:#F6F0E8"></div><div id="new-sentence" class="crator-sentence">Crator takes weeks</div><div id="fast-world" class="offer-world" data-layout-allow-overflow><div id="new-plan" class="plan-sheet new-plan" data-layout-allow-overflow style="visibility:hidden"><div class="plan-heading">Implementation plan</div><div id="new-row-0" class="plan-row"><div class="plan-label">Discovery</div><div class="plan-track"><div id="new-bar-0" class="plan-bar" style="margin-left:0%;width:38%"></div></div></div><div id="new-row-1" class="plan-row"><div class="plan-label">Data migration</div><div class="plan-track"><div id="new-bar-1" class="plan-bar" style="margin-left:18%;width:55%"></div></div></div><div id="new-row-2" class="plan-row"><div class="plan-label">Configuration</div><div class="plan-track"><div id="new-bar-2" class="plan-bar" style="margin-left:42%;width:48%"></div></div></div><div id="new-row-3" class="plan-row"><div class="plan-label">Go-live</div><div class="plan-track"><div id="new-bar-3" class="plan-bar" style="margin-left:87%;width:13%"></div></div></div></div><svg id="runway" viewBox="0 0 4300 1080" aria-hidden="true"><path id="runway-line" d="M830 733 H2200 C2320 733 2320 720 2440 720 H4060" fill="none" stroke="#D77B4E" stroke-width="12" stroke-linecap="round"/><circle id="runway-dot" cx="830" cy="733" r="20" fill="#D77B4E"/></svg><div id="price-copy" class="price-copy" style="visibility:hidden">Start your free trial</div></div><div id="offer-close-ink" class="fill" style="background:#202323;clip-path:polygon(400px 720px,1520px 720px,1520px 720px,400px 720px)"><img id="offer-close-logo" src="assets/brand/crator_logo_full_white.svg" alt="Crator" style="position:absolute;left:750px;top:328px;width:420px;height:130px;object-fit:contain"><div id="offer-close-headline" data-layout-allow-overlap class="offer-close-headline">Start your free trial</div></div></div><script>const tl=gsap.timeline({paused:true});
const runway=document.querySelector('#runway-line');
const runwayLength=runway.getTotalLength();
const travel={p:0};
function positionDot(){const p=runway.getPointAtLength(travel.p*runwayLength);gsap.set('#runway-dot',{x:p.x-830,y:p.y-733});}
gsap.set('#runway-line',{strokeDasharray:runwayLength,strokeDashoffset:runwayLength});
gsap.set('#runway-dot,#runway-line',{autoAlpha:0});
// The sentence reads, then a short vertical mask reveals the timeline in place.
tl.to('#new-sentence',{autoAlpha:0,duration:.24,ease:'sine.inOut'},.66);
tl.fromTo('#new-plan',{y:65,autoAlpha:0},{y:0,autoAlpha:1,duration:.44,ease:'sine.out'},.92);
// The actual bars contract; the sheet stays intact, with no fold or logo morph.
tl.to('#new-plan .plan-bar',{x:(i)=>-[0,219.96,513.24,1063.14][i]+i*80,scaleX:.3,duration:.4,stagger:.035,ease:'sine.inOut'},1.24);
tl.set('#runway-dot,#runway-line',{autoAlpha:1},1.72);
tl.to('#runway-line',{strokeDashoffset:0,duration:1,ease:'sine.inOut'},1.72);
tl.to(travel,{p:1,duration:1,ease:'sine.inOut',onUpdate:positionDot},1.72);
// One continuous camera curve has zero velocity at both ends, with no mid-flight gear change.
tl.to('#fast-world',{x:-2540,y:0,scale:1,duration:1.02,ease:'sine.inOut'},1.72);
tl.set('#new-plan',{autoAlpha:0},2.74);
tl.fromTo('#price-copy',{y:40,autoAlpha:0},{y:0,autoAlpha:1,duration:.36,ease:'sine.out'},2.38);
// Retract the incoming tail so the resting line shares the headline center and width.
tl.to('#runway-dot',{scale:0,duration:.2,ease:'sine.inOut'},2.72);
tl.to('#runway-line',{strokeDashoffset:-(runwayLength-1120),duration:.46,ease:'sine.inOut'},2.76);
// The aligned line opens into ink. The overlap allowance is only for the exact white duplicate inside the opaque reveal mask; the two copies share every glyph position.
tl.to('#runway-line',{stroke:'#202323',duration:.22,ease:'sine.inOut'},3.3);
tl.to('#offer-close-ink',{clipPath:'polygon(0px 0px,1920px 0px,1920px 1080px,0px 1080px)',duration:.66,ease:'sine.inOut'},3.34);
tl.fromTo('#offer-close-logo',{y:20,autoAlpha:0},{y:0,autoAlpha:1,duration:.36,ease:'sine.out'},3.64);
window.__timelines["result"]=tl;</script></template></body></html>
