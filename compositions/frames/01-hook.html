*{box-sizing:border-box}#root{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#faf7f5;color:#202323;font-family:Switzer,sans-serif;font-weight:400}.fill{position:absolute;inset:0;width:1920px;height:1080px}.display{position:absolute;margin:0;line-height:1.08;letter-spacing:-.035em;font-weight:400}.small{font-size:27px;letter-spacing:-.01em}.brand-anchor{position:absolute;left:105px;bottom:61px;width:147px;height:auto}.ui-stage{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden}.gridline{position:absolute;background:#363e3e}.module-item{position:absolute;width:510px;height:345px;text-align:center;color:#faf7f5}.module-item img{display:block;width:140px;height:140px;margin:0 auto}.module-name{font-size:54px;line-height:1.2;letter-spacing:-.035em;margin-top:38px;font-weight:400}.module-detail{font-size:26px;color:#bfc9c5;margin-top:18px}.native-ui h1{font-weight:400!important}.native-ui{font-weight:400}.native-ui [data-ui-prompt]{white-space:normal} .native-ui [class~="text-[#7c7c7c]"]{color:#707070}.native-ui [class~="text-[#c7c7c7]"]{color:#767676}.native-ui [class~="text-[#d45a08]"]{color:#b94f07}.native-ui [class~="text-[#e03e2d]"]{color:#da3c2c}.native-ui aside [class~="bg-[#f9693c]"]{color:#202323}.native-ui [class~="text-[#737373]/60"]{color:#737373} .native-ui [class~="text-[#737373]"]{color:#707070}.native-ui [class~="text-[#797065]"]{color:#746b60}.native-ui [class~="text-[#e7000b]"]{color:#d7000a}

</style><div id="root" data-composition-id="hook" data-start="0" data-duration="4" data-width="1920" data-height="1080"><div id="hook-paper" class="fill" aria-hidden="true" style="opacity:0;background-color:#faf7f5;background-image:linear-gradient(to right,rgba(90,60,10,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(90,60,10,.07) 1px,transparent 1px);background-size:40px 40px"></div><div id="erp-lens" class="fill" data-layout-allow-overflow style="transform-origin:0 0"><div id="hook-camera" class="fill" data-layout-allow-overflow style="z-index:2"><div id="hook-pan" class="fill" data-layout-allow-overflow><div id="hook-line" style="position:absolute;left:120px;top:432px;width:1680px;height:210px;display:flex;align-items:center;justify-content:center;gap:24px;white-space:nowrap;letter-spacing:-.055em;font-size:140px;font-weight:600"><span id="hook-meet">Meet</span><span id="hook-brand" style="position:relative;display:flex;align-items:center;gap:24px"><img id="hook-lovable" src="assets/brand/lovable.svg" alt="Lovable" style="width:110px;height:110px;flex-shrink:0"><span id="hook-name">Lovable</span></span><span id="hook-for">for</span><span id="hook-erp">ERP</span></div></div></div><div id="map-module-0" class="map-module" data-layout-allow-overflow><div id="satellite-0" class="satellite"><img src="assets/erpnext/pastel/stock.svg" alt=""><span>Inventory</span></div></div><div id="map-module-1" class="map-module" data-layout-allow-overflow><div id="satellite-1" class="satellite"><img src="assets/erpnext/pastel/manufacturing.svg" alt=""><span>Manufacturing</span></div></div><div id="map-module-2" class="map-module" data-layout-allow-overflow><div id="satellite-2" class="satellite"><img src="assets/erpnext/pastel/accounting.svg" alt=""><span>Accounting</span></div></div><div id="map-module-3" class="map-module" data-layout-allow-overflow><div id="satellite-3" class="satellite"><img src="assets/erpnext/pastel/selling.svg" alt=""><span>Sales</span></div></div><div id="map-module-4" class="map-module" data-layout-allow-overflow><div id="satellite-4" class="satellite"><img src="assets/erpnext/pastel/buying.svg" alt=""><span>Purchasing</span></div></div><div id="map-module-5" class="map-module" data-layout-allow-overflow><div id="satellite-5" class="satellite"><img src="assets/erpnext/pastel/crm.svg" alt=""><span>CRM</span></div></div><div id="intro-next" class="display" data-layout-allow-overflow style="left:4360px;top:478px;width:1600px;text-align:center;font-size:112px;visibility:hidden">Describe your business.</div></div></div><script>document.fonts.ready.then(()=>{const tl=gsap.timeline({paused:true});
gsap.set('#erp-lens,.map-module,.satellite',{force3D:false});
const lens={cx:960,cy:540,zoom:1};
function placeLens(){gsap.set('#erp-lens',{x:960-lens.cx*lens.zoom,y:540-lens.cy*lens.zoom,scale:lens.zoom});}
// Tighten the entire orbit around the same optical center.
tl.to(lens,{zoom:1.18,duration:.5,ease:'power3.inOut',onUpdate:placeLens},1.25);
// Center the complete lockup using the settled native wordmark geometry.
const brand=document.querySelector('#hook-brand');
const brandX=960-(120+brand.offsetLeft+brand.offsetWidth/2);
gsap.set('#hook-meet,#hook-for,#hook-erp',{autoAlpha:0});
tl.fromTo('#hook-brand',{x:brandX,y:3,scale:1.65},{x:brandX,y:3,scale:1.5,duration:.24,ease:'power2.out'},0);
tl.fromTo('#hook-lovable',{scale:1.18,rotation:-16},{scale:1,rotation:0,duration:.24,ease:'power2.out'},0);
tl.to('#hook-brand',{x:0,y:0,scale:1,duration:.36,ease:'sine.inOut'},.26);
tl.fromTo('#hook-meet,#hook-for,#hook-erp',{y:28,autoAlpha:0},{y:0,autoAlpha:1,duration:.3,stagger:.035,ease:'sine.out'},.42);
tl.to('#hook-meet,#hook-lovable,#hook-name,#hook-for',{opacity:0,duration:.18,ease:'power2.in'},1.2);
tl.to('#hook-erp',{x:-567.32,y:-1.5,scale:1.5,duration:.45,ease:'power3.inOut'},1.2);
const arrangement={line:0,orbit:0};
function placeModules(){
 for(let i=0;i<6;i++){
  const a=(i*60+200)*Math.PI/180+arrangement.orbit;
  const ox=Math.cos(a)*710,oy=Math.sin(a)*310,tilt=-Math.PI/18;
  const sx=960+ox*Math.cos(tilt)-oy*Math.sin(tilt);
  const sy=540+ox*Math.sin(tilt)+oy*Math.cos(tilt);
  const tx=960+i*540,ty=540,f=arrangement.line,u=1-f;
  const x=u*u*sx+2*u*f*(sx+(tx-sx)*.65)+f*f*tx;
  const y=u*u*sy+2*u*f*(sy+(sy<540?-90:90))+f*f*ty;
  const depth=(Math.sin(a)+1)/2;
  gsap.set('#map-module-'+i,{x:x-960,y:y-540,scale:(.9+.16*depth)*(1-f)+f,zIndex:depth>.5||f>.1?4:1});
 }
}
placeModules();
tl.to(arrangement,{orbit:.28,duration:.85,ease:'none',onUpdate:placeModules},1.45);
// The same icons peel off the orbit into a horizontal path past the lens.
tl.to('#hook-erp',{opacity:0,duration:.15},2.23);
tl.to(arrangement,{line:1,duration:.36,ease:'power3.inOut',onUpdate:placeModules},2.27);
tl.to(lens,{zoom:2.3,duration:.3,ease:'power3.inOut',onUpdate:placeLens},2.35);
// Ease into the first icon, then accelerate along the line instead of a constant-speed sweep.
tl.to(lens,{cx:3660,duration:.83,ease:'power1.in',onUpdate:placeLens},2.65);
tl.set('#intro-next',{autoAlpha:1},3.48);
// Continue at almost the same world velocity, then brake as the headline fills the frame.
tl.to(lens,{cx:5160,duration:.46,ease:'power1.out',onUpdate:placeLens},3.48);
tl.to(lens,{zoom:1,duration:.46,ease:'power1.inOut',onUpdate:placeLens},3.48);
tl.to('#hook-paper',{opacity:1,duration:.24,ease:'sine.inOut'},3.7);
tl.fromTo('#satellite-0',{opacity:0,y:90,rotation:-9,scale:.55},{opacity:1,y:0,rotation:0,scale:1,duration:.3,ease:'power3.out'},1.45);
tl.fromTo('#satellite-1',{opacity:0,y:90,rotation:-9,scale:.55},{opacity:1,y:0,rotation:0,scale:1,duration:.3,ease:'power3.out'},1.4749999999999999);
tl.fromTo('#satellite-2',{opacity:0,y:90,rotation:-9,scale:.55},{opacity:1,y:0,rotation:0,scale:1,duration:.3,ease:'power3.out'},1.5);
tl.fromTo('#satellite-3',{opacity:0,y:90,rotation:-9,scale:.55},{opacity:1,y:0,rotation:0,scale:1,duration:.3,ease:'power3.out'},1.525);
tl.fromTo('#satellite-4',{opacity:0,y:90,rotation:-9,scale:.55},{opacity:1,y:0,rotation:0,scale:1,duration:.3,ease:'power3.out'},1.55);
tl.fromTo('#satellite-5',{opacity:0,y:90,rotation:-9,scale:.55},{opacity:1,y:0,rotation:0,scale:1,duration:.3,ease:'power3.out'},1.575);
window.__timelines["hook"]=tl;});</script></template></body></html>
